<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testimonial – Client logos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap">

  <style>
    /* ======================================================================
       Tokens
       ====================================================================== */
    :root {
      --color-text: #130e0d;
      --color-text-muted: #707070;
      --color-surface: #ffffff;
      --color-surface-muted: #f2f2f2;
      --color-line: #f2f2f2;
      --color-divider: #b6b7b4;
      --color-accent: #3d8956;
      --color-avatar-bg: #e3f6e2;

      --font-primary: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-serif: "Newsreader", Georgia, "Times New Roman", serif;

      --container-max: 60rem;
      --section-spacing-block: clamp(3rem, 6vw, 6rem);
      --section-spacing-inline: clamp(1rem, 4vw, 2.5rem);

      --testimonial-row: 5rem;
    }

    /* ======================================================================
       Base
       ====================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-primary);
      color: var(--color-text);
      background-color: var(--color-surface);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img,
    svg {
      display: block;
    }

    /* ======================================================================
       Utilities (only the ones this page uses)
       ====================================================================== */
    .u-text-sm {
      font-size: 0.8125rem;
      line-height: 1.7;
    }

    .u-color-secondary {
      color: var(--color-text-muted);
    }

    .u-bg-secondary {
      background-color: var(--color-surface-muted);
    }

    .u-display-flex {
      display: flex;
    }

    .u-flex-shrink-0 {
      flex-shrink: 0;
    }

    .u-align-items-center {
      align-items: center;
    }

    .u-justify-content-center {
      justify-content: center;
    }

    .u-position-relative {
      position: relative;
    }

    .u-position-absolute {
      position: absolute;
    }

    .u-overflow-hidden {
      overflow: hidden;
    }

    .u-text-wrap-pretty {
      text-wrap: pretty;
    }

    .u-ratio-1 {
      aspect-ratio: 1 / 1;
    }

    .u-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .u-spacing-block {
      padding-block: var(--section-spacing-block);
    }

    .u-spacing-inline {
      padding-inline: var(--section-spacing-inline);
    }

    .u-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ======================================================================
       Layout
       ====================================================================== */
    .container {
      max-width: var(--container-max);
      margin-inline: auto;
    }

    /* ======================================================================
       Testimonial section
       ====================================================================== */

    /* Quote + stat are placed explicitly; logo cells have no placement, so
       auto-placement drops them into the leftover slots at every breakpoint. */
    .testimonial_layout {
      display: grid;
      grid-template-columns: 2fr 5fr 2fr;
      grid-auto-rows: minmax(var(--testimonial-row), auto);
      border-top: 1px solid var(--color-line);
      border-left: 1px solid var(--color-line);
    }

    .testimonial_quote,
    .testimonial_stat,
    .testimonial_logo-cell {
      min-width: 0;
      border-right: 1px solid var(--color-line);
      border-bottom: 1px solid var(--color-line);
    }

    /* Quote cell */
    .testimonial_quote {
      grid-column: 2;
      grid-row: 1 / span 3;
      flex-direction: column;
      justify-content: space-between;
      gap: 2rem;
      margin: 0;
      padding: 2.5rem;
    }

    .testimonial_quote-mark {
      top: 1.6875rem;
      right: 1.375rem;
      width: 3.25rem;
      height: auto;
      fill: var(--color-surface-muted);
    }

    .testimonial_quote-text {
      position: relative;
      margin: 0;
    }

    .testimonial_quote-para {
      max-width: 15em;
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.625rem;
      font-weight: 400;
      line-height: 1.23;
      letter-spacing: -0.025em;
      font-variation-settings: "opsz" 72;
    }

    .testimonial_highlight {
      color: var(--color-accent);
    }

    .testimonial_author {
      align-self: flex-start;
      height: 2rem;
    }

    .testimonial_avatar {
      width: 2rem;
      background-color: var(--color-avatar-bg);
    }

    .testimonial_author-name {
      padding-inline: 0.8125rem;
      border: 1px solid var(--color-line);
      border-left: 0;
      font-style: normal;
      white-space: nowrap;
    }

    .testimonial_author-role {
      padding-inline: 0.8125rem;
      white-space: nowrap;
    }

    /* Stat cell (the content inside shuffles through the stat pool) */
    .testimonial_stat {
      grid-column: 3;
      grid-row: 1 / span 2;
      padding: 1.5rem;
    }

    .testimonial_stat-inner {
      align-items: flex-start;
      gap: 0.5rem;
    }

    .testimonial_stat-icon {
      width: 1.25rem;
      height: 1.25rem;
      margin-top: 0.0625rem;
    }

    .testimonial_stat-divider {
      width: 1px;
      height: 0.5625rem;
      margin-top: 0.25rem;
      background-color: var(--color-divider);
    }

    .testimonial_stat-list {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      margin: 0;
    }

    .testimonial_stat-label {
      margin: 0;
    }

    .testimonial_stat-value {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.5rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      font-variation-settings: "opsz" 72;
    }

    /* Logo cells */
    .testimonial_logo-cell {
      padding: 1rem;
    }

    .testimonial_logo {
      max-width: 100%;
      height: auto;
    }

    /* ======================================================================
       Tablet
       ====================================================================== */
    @media (max-width: 991px) {
      .testimonial_layout {
        grid-template-columns: 1fr 1fr;
      }

      .testimonial_quote {
        grid-column: 1 / -1;
        grid-row: auto;
        min-height: 15rem;
      }

      .testimonial_stat {
        grid-column: 1;
        grid-row: span 2;
      }
    }

    /* ======================================================================
       Mobile
       ====================================================================== */
    @media (max-width: 479px) {
      .testimonial_quote {
        min-height: 0;
        gap: 2.5rem;
        padding: 4rem 1.25rem 1.25rem;
      }

      .testimonial_quote-mark {
        top: 1.25rem;
        right: auto;
        left: 1.25rem;
        width: 2.25rem;
      }

      .testimonial_quote-para {
        font-size: 1.375rem;
      }

      .testimonial_author {
        flex-wrap: wrap;
        height: auto;
      }

      .testimonial_author-name,
      .testimonial_author-role {
        min-height: 2rem;
      }

      .testimonial_stat {
        grid-column: 1 / -1;
        grid-row: auto;
        padding: 1.25rem;
      }
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

  <script>
    /**
     * Testimonial shuffle (GSAP)
     *
     * Logos: every `logoInterval` seconds one random logo slot swaps to a logo
     * from the pool that isn't on screen.
     * Stats: every `statInterval` seconds the stat cell moves to the next stat.
     *
     * Pauses when the section is off-screen, the tab is hidden, or the pointer
     * is over the grid. With prefers-reduced-motion: reduce, nothing shuffles.
     */
    (() => {
      const init = () => {
        const gsap = window.gsap;
        const root = document.querySelector("[data-shuffle]");
        if (!gsap || !root) return;

        const CONFIG = {
          logoInterval: 2.2, // seconds between logo swaps
          statInterval: 4.5, // seconds between stat swaps
          outDuration: 0.45,
          inDuration: 0.65,
          outEase: "power2.in",
          inEase: "expo.out",
          distance: 40, // yPercent
          blur: 6, // px
        };

        /* ---------- Pools ---------- */
        const logoSlots = [...root.querySelectorAll("[data-logo-slot]")];
        const logoPool = [...(root.querySelector("[data-logo-pool]")?.content.querySelectorAll("img") ?? [])].map((img) => ({
          src: img.getAttribute("src"),
          alt: img.getAttribute("alt") || "",
          width: img.getAttribute("width"),
          height: img.getAttribute("height"),
        }));

        const statSlot = root.querySelector("[data-stat-slot]");
        const statPool = [...(root.querySelector("[data-stat-pool]")?.content.querySelectorAll("dl") ?? [])].map((dl) => ({
          label: dl.querySelector("dt")?.textContent.trim() ?? "",
          value: dl.querySelector("dd")?.textContent.trim() ?? "",
        }));

        const canShuffleLogos = logoSlots.length > 0 && logoPool.length > logoSlots.length;
        const canShuffleStats = statSlot && statPool.length > 1;
        if (!canShuffleLogos && !canShuffleStats) return;

        /* ---------- State ---------- */
        const state = {
          motionOK: false,
          inView: false,
          hovered: false,
          pageVisible: !document.hidden,
          preloaded: false,
          lastLogoSlot: -1,
          lastRemovedLogo: null,
          statIndex: 0,
        };

        const currentLogos = logoSlots.map((slot) => slot.querySelector("img").getAttribute("src"));

        // Start the stat pool at whatever the HTML currently shows.
        if (canShuffleStats) {
          const shown = statSlot.querySelector("[data-stat-value]").textContent.trim();
          state.statIndex = Math.max(0, statPool.findIndex((s) => s.value === shown));
        }

        /* ---------- Helpers ---------- */
        const randomFrom = (list) => list[Math.floor(Math.random() * list.length)];

        const decoded = new Map();
        const preload = (src) => {
          if (!decoded.has(src)) {
            const img = new Image();
            img.src = src;
            decoded.set(src, img.decode().catch(() => {}));
          }
          return decoded.get(src);
        };

        // Shared out → swap → in timeline used by both logos and stats.
        const swapTimeline = (target, applyChange) =>
          gsap
            .timeline()
            .to(target, {
              yPercent: -CONFIG.distance,
              autoAlpha: 0,
              filter: `blur(${CONFIG.blur}px)`,
              duration: CONFIG.outDuration,
              ease: CONFIG.outEase,
            })
            .call(applyChange)
            .fromTo(
              target,
              { yPercent: CONFIG.distance, autoAlpha: 0, filter: `blur(${CONFIG.blur}px)` },
              { yPercent: 0, autoAlpha: 1, filter: "blur(0px)", duration: CONFIG.inDuration, ease: CONFIG.inEase }
            )
            .set(target, { clearProps: "transform,filter,opacity,visibility" });

        /* ---------- Logo shuffle ---------- */
        async function swapLogo() {
          // Never the same slot twice in a row.
          const slotIndex = randomFrom(logoSlots.map((_, i) => i).filter((i) => i !== state.lastLogoSlot));
          // A logo that's off-screen, preferably not the one just removed.
          const offscreen = logoPool.filter((item) => !currentLogos.includes(item.src));
          const fresh = offscreen.filter((item) => item.src !== state.lastRemovedLogo);
          const next = randomFrom(fresh.length ? fresh : offscreen);
          const img = logoSlots[slotIndex].querySelector("img");

          await preload(next.src);

          state.lastLogoSlot = slotIndex;
          state.lastRemovedLogo = currentLogos[slotIndex];
          currentLogos[slotIndex] = next.src;

          await swapTimeline(img, () => {
            img.src = next.src;
            img.alt = next.alt;
            if (next.width) img.setAttribute("width", next.width);
            if (next.height) img.setAttribute("height", next.height);
          });
        }

        /* ---------- Stat shuffle ---------- */
        async function swapStat() {
          state.statIndex = (state.statIndex + 1) % statPool.length;
          const next = statPool[state.statIndex];
          const inner = statSlot.querySelector("[data-shuffle-target]");

          await swapTimeline(inner, () => {
            inner.querySelector("[data-stat-label]").textContent = next.label;
            inner.querySelector("[data-stat-value]").textContent = next.value;
          });
        }

        /* ---------- Scheduling ---------- */
        const canRun = () => state.motionOK && state.inView && state.pageVisible && !state.hovered;

        // One loop per pool: wait → swap → wait… A loop pauses between swaps,
        // never mid-animation.
        const createLoop = (interval, swap, startDelay = 0) => {
          let call = null;
          let busy = false;
          let first = true;

          const tick = async () => {
            call = null;
            if (!canRun() || busy) return;
            busy = true;
            await swap();
            busy = false;
            schedule();
          };

          const schedule = () => {
            call?.kill();
            call = null;
            if (!canRun() || busy) return;
            call = gsap.delayedCall(first ? interval + startDelay : interval, tick);
            first = false;
          };

          return { schedule };
        };

        const loops = [];
        if (canShuffleLogos) loops.push(createLoop(CONFIG.logoInterval, swapLogo));
        if (canShuffleStats) loops.push(createLoop(CONFIG.statInterval, swapStat, 1.1)); // offset so it doesn't land with a logo swap

        const update = () => {
          if (canRun() && !state.preloaded) {
            logoPool.forEach((item) => preload(item.src));
            state.preloaded = true;
          }
          loops.forEach((loop) => loop.schedule());
        };

        /* ---------- Triggers ---------- */
        gsap.matchMedia().add("(prefers-reduced-motion: no-preference)", () => {
          state.motionOK = true;
          update();
          return () => {
            state.motionOK = false;
            update();
          };
        });

        new IntersectionObserver(
          ([entry]) => {
            state.inView = entry.isIntersecting;
            update();
          },
          { threshold: 0.25 }
        ).observe(root);

        document.addEventListener("visibilitychange", () => {
          state.pageVisible = !document.hidden;
          update();
        });

        root.addEventListener("pointerenter", () => {
          state.hovered = true;
          update();
        });

        root.addEventListener("pointerleave", () => {
          state.hovered = false;
          update();
        });
      };

      // Works whether GSAP loads before or after this script.
      if (window.gsap) init();
      else window.addEventListener("load", init, { once: true });
    })();
  </script>
</body>
</html>
